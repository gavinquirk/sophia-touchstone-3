<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>GQ Website</title>
  </head>
  <body>
    <a href="#main-content">Skip to main content</a>
    <header>
      <nav aria-label="Primary">
        <img
          id="bakery-logo"
          src="assets/bakery-logo_c.png"
          alt="North Star Bakery Logo"
        />
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main id="main-content">
      <section id="contact-us">
        <h1>Contact Us</h1>
        <form action="" method="post">
          <fieldset>
            <legend>Contact Form</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />

            <label for="pickup-date">Pickup Date:</label>
            <input type="date" id="pickup-date" name="pickup-date" required />

            <label for="request-type">Request Type:</label>
            <select id="request-type" name="request-type" required>
              <option value="">Select an option</option>
              <option value="pre-order">Pre Order</option>
              <option value="general-question">General Question</option>
            </select>

            <label for="item-details">Item Details:</label>
            <textarea id="item-details" name="item-details"></textarea>

            <label for="allergy-notes">Allergy Notes (if applicable):</label>
            <textarea id="allergy-notes" name="allergy-notes"></textarea>

            <button type="submit">Submit</button>
          </fieldset>
        </form>
      </section>
    </main>
    <footer>
      <nav aria-label="Footer">
        <ul>
          <li><a href="privacy.html">Privacy Policy</a></li>
          <li><a href="terms.html">Terms of Service</a></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
